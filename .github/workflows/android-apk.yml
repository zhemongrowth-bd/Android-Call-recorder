name: Android APKs

# Builds the Winstone Android companion (call-log tracing, recording pickup,
# post-call reports) and attaches app-debug.apk to the workflow run.
# Release is signed from encrypted repo secrets; the keystore is never committed.

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Point Gradle at the CI Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: winstone-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build signed release APK
        env:
          WINSTONE_KEYSTORE_B64: ${{ secrets.WINSTONE_KEYSTORE_B64 }}
          WINSTONE_KEYSTORE_PASSWORD: ${{ secrets.WINSTONE_KEYSTORE_PASSWORD }}
          WINSTONE_KEY_ALIAS: ${{ secrets.WINSTONE_KEY_ALIAS }}
          WINSTONE_KEY_PASSWORD: ${{ secrets.WINSTONE_KEY_PASSWORD }}
        run: |
          test -n "$WINSTONE_KEYSTORE_B64" || { echo "Release signing secrets missing"; exit 1; }
          echo "$WINSTONE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          WINSTONE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/release/*.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: winstone-agent-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
