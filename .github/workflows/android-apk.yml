name: Android debug APK

# Builds the Winstone Android companion (call-log tracing, recording pickup,
# post-call reports) and attaches app-debug.apk to the workflow run.
# Debug-signed only: no release keystore or secrets are used here.

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Point Gradle at the CI Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: winstone-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
